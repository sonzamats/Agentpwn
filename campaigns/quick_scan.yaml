# AgentPwn Campaign: Quick Scan
#
# A fast scan with a subset of attack modules and limited attempts.
# Ideal for a quick smoke-test or CI pipeline check.
#
# Usage:
#   agentpwn run campaigns/quick_scan.yaml
#   python examples/basic_scan.py campaigns/quick_scan.yaml
#
# Before running:
#   1. Replace the target configuration with your agent's details.
#   2. Set the appropriate API key environment variable.
#   3. Change permission_confirmed to true after confirming authorization.

name: quick-scan
description: >-
  Quick security scan with a small subset of attack modules. Useful for
  fast feedback during development or as part of a CI pipeline.

target:
  name: my-agent
  target_type: openai_functions
  endpoint: https://api.openai.com/v1
  model: gpt-4
  tools:
    - name: web_search
      description: Search the web for information
      parameters:
        type: object
        properties:
          query:
            type: string
      permissions:
        - network
      risk_level: medium
    - name: read_file
      description: Read file contents
      parameters:
        type: object
        properties:
          path:
            type: string
      permissions:
        - read
      risk_level: high
  system_prompt: You are a helpful assistant.
  auth:
    api_key: ${OPENAI_API_KEY}

# Run only a representative subset of modules for speed
attack_modules:
  - indirect_injection
  - tool_output_injection
  - parameter_injection
  - permission_bypass

max_attempts_per_module: 5
timeout_seconds: 120
parallel: false

report_formats:
  - json
  - markdown

permission_confirmed: false
