# AgentPwn Quick Scan Campaign
#
# A fast campaign that runs a subset of high-severity attack modules.
# Useful for quick checks during development or as a CI gate.
#
# Usage:
#   agentpwn run campaigns/quick_scan.yaml
#
# Before running:
#   1. Set your API key:  export OPENAI_API_KEY="sk-..."
#   2. Update the target configuration below to match your agent.
#   3. Set permission_confirmed to true.

name: quick-scan
description: >
  Fast security scan using high-severity modules only.
  Covers critical prompt injection, tool manipulation, and
  privilege escalation vectors.

target:
  name: my-agent
  target_type: openai_functions
  model: gpt-4
  endpoint: https://api.openai.com/v1
  tools:
    - name: web_search
      description: Search the web for information
      parameters:
        type: object
        properties:
          query:
            type: string
      permissions:
        - network
      risk_level: medium
    - name: read_file
      description: Read a file from the local filesystem
      parameters:
        type: object
        properties:
          path:
            type: string
      permissions:
        - read
      risk_level: high
  auth:
    api_key: ${OPENAI_API_KEY}

# Run only the highest-impact modules for a quick assessment.
attack_modules:
  - tool_output_injection
  - indirect_injection
  - parameter_injection
  - permission_bypass
  - mcp_tool_shadowing

max_attempts_per_module: 5
timeout_seconds: 120
parallel: false

report_formats:
  - json
  - markdown

# REQUIRED: Set to true only if you have authorization to test this target.
permission_confirmed: false
