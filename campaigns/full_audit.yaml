# AgentPwn Full Audit Campaign
#
# A comprehensive campaign that runs ALL attack modules with maximum
# payloads per module. This is the most thorough assessment available
# and is recommended for pre-production security audits.
#
# Expect this to take 10-30 minutes depending on target response times.
#
# Usage:
#   agentpwn run campaigns/full_audit.yaml
#
# Before running:
#   1. Set your API key:  export OPENAI_API_KEY="sk-..."
#   2. Update the target configuration below to match your agent.
#   3. Set permission_confirmed to true.

name: full-audit
description: >
  Comprehensive security audit running all 16 attack modules with
  full payload sets. Covers prompt injection, tool manipulation,
  privilege escalation, multi-agent attacks, and MCP-specific vectors.
  Generates reports in JSON, Markdown, and HTML.

target:
  name: my-agent
  target_type: openai_functions
  model: gpt-4
  endpoint: https://api.openai.com/v1
  system_prompt: null  # Set this if you know the agent's system prompt
  tools:
    - name: web_search
      description: Search the web for information
      parameters:
        type: object
        properties:
          query:
            type: string
      permissions:
        - network
      risk_level: medium

    - name: read_file
      description: Read a file from the local filesystem
      parameters:
        type: object
        properties:
          path:
            type: string
      permissions:
        - read
      risk_level: high

    - name: write_file
      description: Write content to a file
      parameters:
        type: object
        properties:
          path:
            type: string
          content:
            type: string
      permissions:
        - write
      risk_level: high

    - name: database_query
      description: Execute a SQL query against the application database
      parameters:
        type: object
        properties:
          query:
            type: string
      permissions:
        - read
        - write
      risk_level: high

    - name: send_email
      description: Send an email to a recipient
      parameters:
        type: object
        properties:
          to:
            type: string
          subject:
            type: string
          body:
            type: string
      permissions:
        - network
        - write
      risk_level: high

    - name: code_execute
      description: Execute Python code in a sandbox
      parameters:
        type: object
        properties:
          code:
            type: string
      permissions:
        - execute
      risk_level: critical

  auth:
    api_key: ${OPENAI_API_KEY}

# Empty list = run ALL available modules (all 16).
attack_modules: []

max_attempts_per_module: 10
timeout_seconds: 600
parallel: false

report_formats:
  - json
  - markdown
  - html

# REQUIRED: Set to true only if you have authorization to test this target.
permission_confirmed: false
