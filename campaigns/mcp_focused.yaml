# AgentPwn MCP-Focused Campaign
#
# A targeted campaign for agents connected to MCP (Model Context Protocol)
# servers. Tests MCP-specific attack vectors alongside general prompt
# injection and tool manipulation that apply to MCP environments.
#
# Usage:
#   agentpwn run campaigns/mcp_focused.yaml
#
# Before running:
#   1. Set your API key:  export OPENAI_API_KEY="sk-..."
#   2. Ensure your MCP server is running and accessible.
#   3. Update the target configuration below.
#   4. Set permission_confirmed to true.

name: mcp-security-audit
description: >
  Focused security audit for MCP-connected agents. Tests tool shadowing,
  capability abuse, malicious server simulation, plus general injection
  and tool manipulation vectors that apply to MCP environments.

target:
  name: my-mcp-agent
  target_type: mcp
  model: gpt-4
  endpoint: http://localhost:8080/mcp
  tools:
    - name: web_search
      description: Search the web for information
      parameters:
        type: object
        properties:
          query:
            type: string
      permissions:
        - network
      risk_level: medium

    - name: read_file
      description: Read a file from the filesystem
      parameters:
        type: object
        properties:
          path:
            type: string
      permissions:
        - read
      risk_level: high

    - name: database_query
      description: Execute a SQL query
      parameters:
        type: object
        properties:
          query:
            type: string
      permissions:
        - read
        - write
      risk_level: high

    - name: send_email
      description: Send an email
      parameters:
        type: object
        properties:
          to:
            type: string
          subject:
            type: string
          body:
            type: string
      permissions:
        - network
        - write
      risk_level: high

    - name: code_execute
      description: Execute code in a sandbox
      parameters:
        type: object
        properties:
          code:
            type: string
      permissions:
        - execute
      risk_level: critical

  auth:
    api_key: ${OPENAI_API_KEY}

# MCP-specific modules plus cross-cutting attacks relevant to MCP.
attack_modules:
  # MCP-specific attack surface
  - mcp_tool_shadowing
  - mcp_capability_abuse
  - mcp_malicious_server

  # Prompt injection (applies to MCP agents via tool outputs)
  - tool_output_injection
  - indirect_injection

  # Tool manipulation (MCP tools are the primary attack surface)
  - parameter_injection
  - schema_abuse
  - tool_confusion
  - chain_exploitation

  # Privilege escalation (MCP permission model)
  - permission_bypass
  - cross_tool_escalation

max_attempts_per_module: 10
timeout_seconds: 300
parallel: false

report_formats:
  - json
  - markdown
  - html

# REQUIRED: Set to true only if you have authorization to test this target.
permission_confirmed: false
