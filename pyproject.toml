[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpwn"
version = "0.1.0"
description = "The first open-source security testing framework for agentic AI systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Wyatt Matson", email = "wyatt@matsoncapitalgroup.com" },
]
keywords = [
    "security",
    "ai",
    "llm",
    "agent",
    "red-team",
    "pentesting",
    "prompt-injection",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "openai>=1.0",
    "anthropic>=0.25",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1",
    "langchain-core>=0.1",
]
crewai = [
    "crewai>=0.1",
]
mcp = [
    "mcp>=1.0",
]
all = [
    "agentpwn[langchain,crewai,mcp]",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "types-aiofiles>=23.0",
]

[project.urls]
Homepage = "https://github.com/wyattmatson/agentpwn"
Documentation = "https://github.com/wyattmatson/agentpwn/tree/main/docs"
Repository = "https://github.com/wyattmatson/agentpwn"
Issues = "https://github.com/wyattmatson/agentpwn/issues"

[project.scripts]
agentpwn = "agentpwn.cli:main"

[tool.setuptools.packages.find]
include = ["agentpwn*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",  # line too long - handled by formatter
    "A003",  # shadowing builtins on class attributes
]

[tool.ruff.lint.isort]
known-first-party = ["agentpwn"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["agentpwn"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
